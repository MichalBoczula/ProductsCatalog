services:
  # 1. SQL Server Database Service
  product-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-catalog-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Your .NET Core API Service
  productcatalogapi:
    image: productcatalogapi:latest
    container_name: product-catalog-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProductCatalogDb=Server=product-db;Database=ProductsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - Database__ApplyMigrations=${APPLY_MIGRATIONS:-false}
    depends_on:
      product-db:
        condition: service_healthy

volumes:
  mssql_data:
