services:
  # 1. SQL Server Database Service
  product-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-catalog-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # 2. Your .NET Core API Service
  productcatalogapi:
    image: productcatalogapi:latest
    container_name: product-catalog-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProductCatalogDb=Server=product-db;Database=ProductsDb;User Id=sa;Password=YourStrong@Password123!;TrustServerCertificate=True
    depends_on:
      - product-db

volumes:
  mssql_data: