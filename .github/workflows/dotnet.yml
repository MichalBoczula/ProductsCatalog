  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
      - domain-unit-tests
      - application-unit-tests
      - infrastructure-unit-tests
      - acceptance-tests
      - secret-scan
      - dependency-review
    steps:
      - name: Require successful quality checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOMAIN_RESULT: ${{ needs.domain-unit-tests.result }}
          APPLICATION_RESULT: ${{ needs.application-unit-tests.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure-unit-tests.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance-tests.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          for check in BUILD DOMAIN APPLICATION INFRASTRUCTURE ACCEPTANCE SECRET_SCAN; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$check must succeed; actual result: $result" >&2
              exit 1
            fi
          done

          case "$EVENT_NAME" in
            pull_request) expected_dependency_result=success ;;
            push) expected_dependency_result=skipped ;;
            *) echo "Unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$DEPENDENCY_REVIEW_RESULT" != "$expected_dependency_result" ]]; then
            echo "Dependency Review must be $expected_dependency_result on $EVENT_NAME; actual result: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi

  build-docker-image:
    # Dependency Review is intentionally skipped on push; only the successful
    # quality gate permits image work through that skipped ancestor.
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality-gate

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ProductCatalog.Api/Dockerfile
          push: false
          load: true
          tags: productcatalogapi:ci

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: productcatalogapi:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Record scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' productcatalogapi:ci)"
          test -n "$image_id"
          echo "Scanned image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          repository=mb0101/product-catalog-api
          sha_tag="$repository:$GITHUB_SHA"
          latest_tag="$repository:latest"
          scanned_id="$(docker image inspect --format '{{.Id}}' productcatalogapi:ci)"

          docker tag productcatalogapi:ci "$sha_tag"
          docker tag productcatalogapi:ci "$latest_tag"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"

          docker push "$sha_tag" | tee "$RUNNER_TEMP/push-sha.log"
          docker push "$latest_tag" | tee "$RUNNER_TEMP/push-latest.log"
          sha_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-sha.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          test -n "$sha_digest"
          test "$sha_digest" = "$latest_digest"
          echo "Published $sha_tag and $latest_tag from image $scanned_id with digest $sha_digest" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
