  build-docker-image:
    runs-on: ubuntu-latest
    needs:
      - domain-unit-tests
      - application-unit-tests
      - infrastructure-unit-tests
      - acceptance-tests

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ProductCatalog.Api/Dockerfile
          push: false
          load: true
          tags: productcatalogapi:latest

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: productcatalogapi:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ProductsCatalog.sln

      - name: Run Domain and Application tests with coverage
        run: |
          dotnet test ./tests/ProductCatalog.Domain.UnitTests/ProductCatalog.Domain.UnitTests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory ./TestResults/Coverage/Domain
          dotnet test ./tests/ProductsCatalog.Application.UnitTests/ProductsCatalog.Application.UnitTests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory ./TestResults/Coverage/Application

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.7

      - name: Create and enforce coverage report
        run: >
          reportgenerator
          -reports:"./TestResults/Coverage/**/coverage.cobertura.xml"
          -targetdir:"./TestResults/CoverageReport"
          -reporttypes:"Html;TextSummary"
          -minimumCoverageThresholds:"lineCoverage=70"

      - name: Publish coverage summary
        if: always()
        run: cat ./TestResults/CoverageReport/Summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2

  push-docker-image:
    runs-on: ubuntu-latest
    needs:
      - build-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ProductCatalog.Api/Dockerfile
          push: true
          tags: |
            mb0101/product-catalog-api:latest
            mb0101/product-catalog-api:${{ github.sha }}
